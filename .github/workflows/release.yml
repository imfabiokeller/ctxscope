name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    # Creating the release and uploading its files is the only write, and
    # only this job may do it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes list the commits since the previous tag, which needs
          # the history and the tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build, check the version, zip and checksum
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ctxscope $version" \
            --notes-file build/release-notes.md \
            "build/ctxscope-$version.zip" \
            "build/ctxscope-$version.zip.sha256"
