name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Arm64, macOS 26, with Xcode 26 installed, which Package.swift needs.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests
      - name: Architecture
        run: scripts/check-architecture.sh
