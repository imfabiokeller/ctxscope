name: Set up Swift
description: >
  Selects Xcode 26, prints the toolchain, and restores the SwiftPM build
  folder. Both workflows use it, so the toolchain is chosen in one place.
runs:
  using: composite
  steps:
    - name: Select Xcode 26
      id: xcode
      shell: bash
      run: |
        # The image's default Xcode is used when it is a 26, so a newer one
        # on the runner is picked up without editing this file. Otherwise the
        # newest installed Xcode 26 is selected by path.
        if ! xcodebuild -version | head -1 | grep -q '^Xcode 26'; then
          newest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
        fi
        xcodebuild -version
        swift --version
        echo "version=$(xcodebuild -version | head -1 | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
    - name: Restore the build folder
      uses: actions/cache@v4
      with:
        path: .build
        # A build is only reusable with the same toolchain. Within one, the
        # sources hash picks an exact match and the prefix a recent build
        # that SwiftPM brings up to date incrementally.
        key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
        restore-keys: |
          spm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
